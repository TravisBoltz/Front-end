<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Import css file from folder css-->
    <link href="css/styles.css" rel="stylesheet">
    <title>General Form</title>
    <h1 id="title">KNUST</h1>
    <p id="description">Thank you for your time</p>
</head>
<body>
    <form id="survey-form" action="#">
    <fieldset>
        <label for="name" id="name-label">Name
            <input id="name" type="text" required placeholder="Enter your name here...">
        </label>
    </fieldset>
    <fieldset>
        <label for="email" id="email-label">Email
            <input id="email" type="email" required placeholder="Enter your email here...">
        </label>
    </fieldset>
    <fieldset>
        <label for="number" id="number-label">Age(optional)
            <input id="number" min="10" max="99" required type="number" placeholder="Age">
        </label>
    </fieldset>
    <fieldset>
        <label for="dropdown">Which option best describes your current admission?
            <select id="dropdown">
                <option class="grey">Select current option</option>
                <option>Undergraduate</option>
                <option>Post Graduate</option>
                <option>Distance Learning</option>
                <option>Masters</option>
                <option>Ph D</option> >
            </select>
        </label>
    </fieldset>
    <fieldset>
        <p>What is your residential status?</p>
            <label><input name="Rad" type="radio" value="1">Campus</label>
            <label><input name="Rad" type="radio" value="1">Off-Campus</label>
            <label><input name="Rad" type="radio" value="1">From Home</label>
    </fieldset>
    <fieldset>
        <label for="feature">What is your current level?
            <select id="feature">
                <option class="grey">Selet an option</option>
                <option>100</option>
                <option>200</option>
                <option>300</option>
                <option>400</option>
                <option>500</option>
                <option>600</option>
            </select>
        </label>
    </fieldset>
    <fieldset>
        <p >What skills would you like to obtain?<br>(Check all that apply)</p>
            <label for="re1"><input id="re1" type="checkbox" value="1">Social Networking</label>
            <label for="re2"><input id="re2" type="checkbox" value="2">Data Visualization</label>
            <label for="re3"><input id="re3" type="checkbox" value="3">Enterpreneuership</label>
            <label for="re4"><input id="re4" type="checkbox" value="4">Communication</label>
            <label for="re5"><input id="re5" type="checkbox" value="5">Web Development</label>
            <label for="re6"><input id="re6" type="checkbox" value="value">App Development</label>
            <label for="re7"><input id="re7" type="checkbox" value="7">Marriage</label>
            <label for="re8"><input id="re8" type="checkbox" value="8">Leadership</label>
            <label for="re9"><input id="re9" type="checkbox" value="9">Inspiration</label>
            <label for="re"><input id="re" type="checkbox" value="Checked">Others</label>
    </fieldset>    
    <fieldset>
        <label for="comment">Any comments or suggestions?
            <textarea id="comment" rows="6" cols="40" placeholder="Enter your comment here..."></textarea>
            <input id="submit" type="submit" value="Submit">
        </label>
    </fieldset>
 
</form>
</body>
</html>
