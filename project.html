<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/styles.css" rel="stylesheet">
    <title>freeCodeCamp Survey Form</title>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
</head>
<body>
    <form id="survey-form" action="exmaple.html">
    <fieldset>
        <label for="name" id="name-label">Name
            <input id="name" type="text" required placeholder="Enter your name">
        </label>
    </fieldset>
    <fieldset>
        <label for="email" id="email-label">Email
            <input id="email" type="email" required placeholder="Enter your Email">
        </label>
    </fieldset>
    <fieldset>
        <label for="number" id="number-label">Age(optional)
            <input id="number" min="10" max="99" required type="number" placeholder="Age">
        </label>
    </fieldset>
    <fieldset>
        <label for="dropdown">Which option best describes your current role?
            <select id="dropdown">
                <option>Select current role</option>
                <option>Student</option>
                <option>Full Time Job</option>
                <option>Full Time Learner</option>
                <option>Prefer not to say</option>
                <option>Others</option> >
            </select>
        </label>
    </fieldset>
    <fieldset>
        <label>Would you recommend freeCodeCamp to a friend?
            <input name="Rad" type="radio" value="1">Definitely
            <input name="Rad" type="radio" value="2">Maybe
            <input name="Rad" type="radio" value="3">Not sure
        </label> 
    </fieldset>
    <fieldset>
        <label for="feature">What is your favorite feature of freeCodeCamp?
            <select id="feature">
                <option>Selet an option</option>
                <option>Challenges</option>
                <option>Projects</option>
                <option>Community</option>
                <option>Open Source</option>
            </select>
        </label>
    </fieldset>
    <fieldset>
        <label for="re" >What would you like to see improved? (Check all that apply)
            <input id="re" type="checkbox" value="9">Front-end Projects
            <input id="re" type="checkbox" value="1">Back-end Projects
            <input id="re" type="checkbox" value="2">Data Visualization
            <input id="re" type="checkbox" value="2">Data Visualization
            <input id="re" type="checkbox" value="3">Challenges
            <input id="re" type="checkbox" value="4">Open Source Community
            <input id="re" type="checkbox" value="5">Gitter help rooms
            <input id="re" type="checkbox" value="value">Videos
            <input id="re" type="checkbox" value="7">City Meetups
            <input id="re" type="checkbox" value="8">Wiki
            <input id="re" type="checkbox" value="9">Forum
            <input id="re" type="checkbox" value="Checked">Additional Courses
        </label>
    </fieldset>    
    <fieldset>
        <label for="comment">Any comments or suggestions?
            <textarea id="comment" rows="6" cols="40" placeholder="Enter your comment here..."></textarea>
            <input id="submit" type="submit" value="submit">
        </label>
    </fieldset>
 
</form>
</body>
</html>
